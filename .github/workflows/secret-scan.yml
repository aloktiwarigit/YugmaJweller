name: secret-scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the repo config explicitly so the base64 image-asset allowlist is
          # always honored (don't rely on auto-detection of .gitleaks.toml).
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml
